<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">IT Automation Toolkit architecture</title>
  <desc id="desc">Commands use a fictional provider backed by CSV and JSON files, templates, audit logs and generated reports.</desc>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <style>.box{fill:#fff;stroke:#334155;stroke-width:3}.blue{fill:#dbeafe}.green{fill:#dcfce7}.amber{fill:#fef3c7}.node{fill:#fff;stroke:#64748b;stroke-width:2}.title{font:700 28px sans-serif;fill:#0f172a}.label{font:600 16px sans-serif;fill:#1e293b}.small{font:14px sans-serif;fill:#475569}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <text x="500" y="48" text-anchor="middle" class="title">IT Automation Toolkit</text>
  <rect x="60" y="95" width="250" height="360" rx="8" class="box blue"/>
  <text x="185" y="125" text-anchor="middle" class="label">Public commands</text>
  <rect x="85" y="150" width="200" height="42" rx="5" class="node"/><text x="185" y="177" text-anchor="middle" class="small">Onboarding / Offboarding</text>
  <rect x="85" y="205" width="200" height="42" rx="5" class="node"/><text x="185" y="232" text-anchor="middle" class="small">Transfer / Copy Access</text>
  <rect x="85" y="260" width="200" height="42" rx="5" class="node"/><text x="185" y="287" text-anchor="middle" class="small">Support Snapshot</text>
  <rect x="85" y="315" width="200" height="42" rx="5" class="node"/><text x="185" y="342" text-anchor="middle" class="small">Inventory / Health / Review</text>
  <rect x="85" y="370" width="200" height="42" rx="5" class="node"/><text x="185" y="397" text-anchor="middle" class="small">HTML / CSV / JSON Reports</text>
  <rect x="375" y="95" width="250" height="360" rx="8" class="box green"/>
  <text x="500" y="125" text-anchor="middle" class="label">Fictional provider</text>
  <rect x="400" y="155" width="200" height="50" rx="5" class="node"/><text x="500" y="176" text-anchor="middle" class="small">Private/Provider.ps1</text><text x="500" y="196" text-anchor="middle" class="small">CSV + JSON access</text>
  <rect x="400" y="225" width="200" height="50" rx="5" class="node"/><text x="500" y="246" text-anchor="middle" class="small">Write-AuditLog</text><text x="500" y="266" text-anchor="middle" class="small">Audit helper</text>
  <rect x="400" y="295" width="200" height="50" rx="5" class="node"/><text x="500" y="316" text-anchor="middle" class="small">Ticket correlation</text><text x="500" y="336" text-anchor="middle" class="small">Validation + WhatIf</text>
  <rect x="400" y="365" width="200" height="50" rx="5" class="node"/><text x="500" y="386" text-anchor="middle" class="small">Escaping + report builders</text><text x="500" y="406" text-anchor="middle" class="small">No external services</text>
  <rect x="690" y="95" width="250" height="360" rx="8" class="box amber"/>
  <text x="815" y="125" text-anchor="middle" class="label">Fictional data and outputs</text>
  <rect x="715" y="150" width="200" height="42" rx="5" class="node"/><text x="815" y="177" text-anchor="middle" class="small">employees.csv</text>
  <rect x="715" y="205" width="200" height="42" rx="5" class="node"/><text x="815" y="232" text-anchor="middle" class="small">groups.csv / devices.csv</text>
  <rect x="715" y="260" width="200" height="42" rx="5" class="node"/><text x="815" y="287" text-anchor="middle" class="small">role-templates/*.json</text>
  <rect x="715" y="315" width="200" height="42" rx="5" class="node"/><text x="815" y="342" text-anchor="middle" class="small">audit.jsonl</text>
  <rect x="715" y="370" width="200" height="42" rx="5" class="node"/><text x="815" y="397" text-anchor="middle" class="small">HTML / CSV / JSON / evidence</text>
  <path d="M310 275 H375" class="arrow"/><path d="M625 275 H690" class="arrow"/><path d="M815 412 V500" class="arrow"/><path d="M500 455 V500" class="arrow"/><rect x="305" y="500" width="390" height="70" rx="8" class="box"/><text x="500" y="528" text-anchor="middle" class="label">Safety boundary</text><text x="500" y="552" text-anchor="middle" class="small">SupportsShouldProcess • -WhatIf • -Confirm • audit trail</text>
</svg>
